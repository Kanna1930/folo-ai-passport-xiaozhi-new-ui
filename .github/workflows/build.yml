name: Build Folo AI Passport (Pixel Sister UI v1)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # The official FoloToy AI Passport baseline is validated with ESP-IDF 5.5.3.
      image: espressif/idf:v5.5.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run host tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Build ESP32-C3 firmware
        shell: bash
        run: |
          set -e
          source "$IDF_PATH/export.sh"
          python scripts/build.py folo/ai-passport-c3 \
            --name folo-ai-passport-c3 \
            --language zh-CN \
            --wake-word nihaoxiaozhi

      - name: Verify merged firmware exists
        shell: bash
        run: |
          test -f build/merged-binary.bin
          ls -lh build/merged-binary.bin

      - name: Upload merged firmware
        uses: actions/upload-artifact@v4
        with:
          name: folo-ai-passport-pixel-sister-ui-v1
          path: build/merged-binary.bin
          if-no-files-found: error
